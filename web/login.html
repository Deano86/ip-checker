<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · IP Checker by Deano86</title><script src="/theme.js"></script><link rel="stylesheet" href="/style.css"><script src="/login.js" defer></script></head>
<body class="login-page"><main class="login-shell"><a class="login-brand" href="https://github.com/Deano86/ip-checker" target="_blank" rel="noreferrer">IP Checker <small>by Deano86 ↗</small></a><section class="panel login-card"><div class="eyebrow">YOUR INVESTIGATION WORKSPACE</div><h1>Welcome back.</h1><p class="intro">Sign in to your saved checks and intelligence reports.</p><form id="login-form" class="account-form"><label>Username<input name="username" autocomplete="username" required maxlength="64"></label><label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><button class="button primary" type="submit">Sign in →</button></form><button class="text-button" id="show-reset" type="button">Forgot password?</button><form id="forgot-form" class="account-form" hidden><label>Account email<input name="email" type="email" autocomplete="email" maxlength="254" required></label><button class="button secondary">Send reset link</button></form><form id="reset-form" class="account-form" hidden><label>New password<input name="password" type="password" autocomplete="new-password" required minlength="15" maxlength="128"></label><label>Confirm password<input name="confirm" type="password" autocomplete="new-password" required minlength="15" maxlength="128"></label><button class="button primary">Reset password</button></form><p id="login-message" role="status"></p><p class="email-disclosure">Accounts are created by your administrator. Forgotten your password? Contact them for a reset.</p></section><p class="login-footer">Private history. Your server. Your keys.</p></main></body></html>
